name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios-app/**'

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: ios-app
        run: npm install

      - name: Sync web assets
        working-directory: ios-app
        run: npx cap sync ios

      - name: Configurer Info.plist (chiffrement + AdMob + ATT)
        run: |
          python3 - << 'PYEOF'
          import plistlib
          p = 'ios-app/ios/App/App/Info.plist'
          with open(p, 'rb') as f:
              d = plistlib.load(f)
          d['ITSAppUsesNonExemptEncryption'] = False
          d['GADApplicationIdentifier'] = 'ca-app-pub-6145497382360748~3506964308'
          d['NSUserTrackingUsageDescription'] = "U9 utilise cette autorisation pour vous proposer des publicites adaptees a vos centres d'interet."
          skan_ids = [
              "cstr6suwn9.skadnetwork","4fzdc2evr5.skadnetwork","2fnua5tdw4.skadnetwork",
              "ydx93a7ass.skadnetwork","p78axxw29g.skadnetwork","v72qych5uu.skadnetwork",
              "ludvb6z3bs.skadnetwork","cp8zw746q7.skadnetwork","3sh42y64q3.skadnetwork",
              "c6k4g5qg8m.skadnetwork","s39g8k73mm.skadnetwork","3qy4746246.skadnetwork",
              "f38h382jlk.skadnetwork","hs6bdukanm.skadnetwork","v4nxqhlyqp.skadnetwork",
              "wzmmz9fp6w.skadnetwork","yclnxrl5pm.skadnetwork","t38b2kh725.skadnetwork",
              "7ug5zh24hu.skadnetwork","gta9lk7p23.skadnetwork","vutu7akeur.skadnetwork",
              "y5ghdn5j9k.skadnetwork","n6fk4nfna4.skadnetwork","v9wttpbfk9.skadnetwork",
              "n38lu8286q.skadnetwork","47vhws6wlr.skadnetwork","kbd757ywx3.skadnetwork",
              "9t245vhmpl.skadnetwork","a2p9lx4jpn.skadnetwork","22mmun2rn5.skadnetwork",
              "4468km3ulz.skadnetwork","2u9pt9hc89.skadnetwork","8s468mfl3y.skadnetwork",
              "klf5c3l5u5.skadnetwork","ppxm28t8ap.skadnetwork","kbmxgpxpgc.skadnetwork",
              "uw77j35x4d.skadnetwork","578prtvx9j.skadnetwork","4dzt52r2t5.skadnetwork",
              "tl55sbb4fm.skadnetwork","e5fvkxwrpn.skadnetwork","8c4e2ghe7u.skadnetwork",
              "zq492l623r.skadnetwork","3rd42ekr43.skadnetwork","3qcr597p9d.skadnetwork"
          ]
          d['SKAdNetworkItems'] = [{'SKAdNetworkIdentifier': i} for i in skan_ids]
          with open(p, 'wb') as f:
              plistlib.dump(d, f)
          print('Info.plist mis a jour (chiffrement + AdMob + ATT + SKAdNetwork)')
          PYEOF

      - name: Installer le certificat et le profil
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)

          echo -n "$CERT_BASE64" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          echo -n "$PROFILE_BASE64" | base64 --decode -o $RUNNER_TEMP/profile.mobileprovision

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $RUNNER_TEMP/certificate.p12 -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/"Provisioning Profiles"/

      - name: Creer ExportOptions.plist
        working-directory: ios-app/ios/App
        run: |
          cat > ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>UJKT7LJFD3</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.verby188.u9</key>
                  <string>U9_AppStore</string>
              </dict>
          </dict>
          </plist>
          EOF

      - name: Archiver l'application
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER=U9_AppStore \
            DEVELOPMENT_TEAM=UJKT7LJFD3 \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Exporter l'IPA
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: U9-ipa
          path: ios-app/ios/App/build/ipa/*.ipa

      - name: Upload vers TestFlight
        working-directory: ios-app/ios/App
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$API_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app \
            -f build/ipa/App.ipa \
            -t ios \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER_ID"

  build-simulator:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: ios-app
        run: npm install

      - name: Sync web assets
        working-directory: ios-app
        run: npx cap sync ios

      - name: Build pour simulateur
        working-directory: ios-app/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Zipper le .app simulateur
        working-directory: ios-app/ios/App
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r App-sim.zip App.app

      - name: Upload build simulateur (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: U9-simulator
          path: ios-app/ios/App/build/Build/Products/Debug-iphonesimulator/App-sim.zip
