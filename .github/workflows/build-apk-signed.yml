name: Build AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.0"

      - name: Create google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build Release AAB
        run: gradle bundleRelease --no-daemon

      - name: Sign AAB
        id: sign_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          RELEASE_DIR="app/build/outputs/bundle/release"
          AAB_FILE=$(find "$RELEASE_DIR" -name "*.aab" | head -n 1)
          echo "AAB trouvé : $AAB_FILE"

          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d -i > release.keystore

          if [ ! -s release.keystore ]; then
            echo "Erreur : le keystore décodé est vide, vérifie le secret KEYSTORE_BASE64."
            exit 1
          fi

          jarsigner -verbose \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore release.keystore \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            "$AAB_FILE" "$KEY_ALIAS"

          jarsigner -verify "$AAB_FILE"
          rm -f release.keystore

          echo "signedReleaseFile=$AAB_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload Signed AAB
        uses: actions/upload-artifact@v6
        with:
          name: U9-release
          path: ${{ steps.sign_app.outputs.signedReleaseFile }}
          retention-days: 30
